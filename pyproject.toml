[project]
name = "slicekit"
version = "0.1.0"
description = "Slice CT scans into 3D-printable plates (interlocking kit or slice stack) with halftone infill that shows the anatomy."
authors = [{ name = "Pedram Ramezani", email = "me@pedramramezani.de" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ct", "dicom", "3d-printing", "halftone", "build123d", "medical-imaging"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "build123d>=0.9",
    "numpy>=2",
    "scipy",
    "scikit-image",
    "shapely>=2.1",
    "pillow",
    "pydicom>=2.4",
    "rich",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "typing-extensions>=4.14",  # Sentinel (PEP 661)
    # decoders for compressed DICOM (JPEG baseline/extended/lossless, JPEG 2000)
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
]

[project.optional-dependencies]
viz = ["ocp_vscode"]
download = ["idc-index>=0.13"]

[project.scripts]
slicekit = "slicekit.cli.main:main"
slicekit-download = "slicekit.cli.download:main"

[project.urls]
Homepage = "https://pedRamezani.github.io/slicekit/"
Repository = "https://github.com/pedRamezani/slicekit"
Documentation = "https://pedRamezani.github.io/slicekit/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    # tests/test_download.py fakes the IDC index with a DataFrame
    "pandas",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "types-shapely",
    "scipy-stubs",
    "pandas-stubs",
    "ruff>=0.15.7",
    "zensical>=0.0.26",
    "mkdocstrings-python>=1.0.3",
    # runs the code blocks in docs/parameters.md at build time
    "markdown-exec>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slicekit"]

[tool.mypy]
files = ["src"]
strict = true
disallow_any_unimported = true
show_error_codes = true

[[tool.mypy.overrides]]
# No type information published for these.
module = ["skimage.*", "ocp_vscode.*", "idc_index.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/slicekit"]

[tool.deptry.per_rule_ignores]
# Optional extras, imported lazily where they are used.
DEP002 = [
    "ocp_vscode",
    "idc-index",
    # Decoders that pydicom loads as plugins for compressed DICOM; never imported directly.
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # pydocstyle (Google convention, see [tool.ruff.lint.pydocstyle])
    "D",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # Exception messages are written inline at the raise site.
    "TRY003",
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.ruff.format]
preview = true
